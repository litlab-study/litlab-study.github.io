<!DOCTYPE html>
<html lang="en">    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macbeth Flashcards</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=home" />
</head>
<body>
    <div class="flashcards-container">
            <h1>Flashcard Quiz! ⭐ </h1>
            <p> This feature can be used to help you memorise each quote! Make sure you also know who it's said by and approximately where it is found in the text.</p>
        <div id="flashcard" class="flashcard">
            <div class="front">
                <p id="question">Question will appear here</p>
            </div>
            <div class="back">
                <p id="answer">Answer will appear here</p>
            </div>
        </div>
        <button id="prev-card">Previous</button>
        <button id="flip-card">Flip Flashcard</button>
        <button id="next-card">Next</button>
    </div>
<script src="m_flash_script.js"></script>
</body>
</html>
